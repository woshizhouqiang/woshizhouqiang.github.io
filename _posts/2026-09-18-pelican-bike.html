<style>

<body>

      <!-- 车座 -->

      <!-- 车把 -->

      <!-- 牙盘 + 曲柄（旋转） -->

        <line x1="445" y1="450" x2="417" y2="450" opacity=".55"/>

    <!-- 远侧腿（在身体后面） -->

      <!-- 脖子（描边垫底 + 白色主体） -->
      <path d="M 452 302 C 472 282 480 260 490 244" fill="none" stroke="#2e2a26" stroke-width="31" stroke-linecap="round"/>
      <path d="M 452 302 C 472 282 480 260 490 244" fill="none" stroke="#f7f7f5" stroke-width="24" stroke-linecap="round"/>
      <!-- 身体 -->
      <ellipse cx="420" cy="318" rx="62" ry="48" fill="#f7f7f5" stroke="#2e2a26" stroke-width="3"
               transform="rotate(-12 420 318)"/>
      <!-- 头（含喙、喉囊、眼睛），随踩踏轻微点头 -->
      <g id="headG">
        <circle cx="502" cy="232" r="21" fill="#f7f7f5" stroke="#2e2a26" stroke-width="3"/>

                   Q 622 288 570 284 Q 532 276 516 250 Z"
                fill="#f6c08a" stroke="#2e2a26" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <!-- 上喙 -->
        <path d="M 512 218 L 654 240 Q 660 243 652 248 L 514 240 Z"
              fill="#f4a940" stroke="#2e2a26" stroke-width="3" stroke-linejoin="round"/>
        <!-- 眼睛（会眨眼） -->
        <g id="eyeG">
          <circle cx="500" cy="226" r="5" fill="#2e2a26"/>
          <circle cx="501.6" cy="224.4" r="1.7" fill="#ffffff"/>
        </g>
        <!-- 头顶呆毛 -->
        <path d="M 494 213 Q 490 202 482 198" fill="none" stroke="#2e2a26" stroke-width="3" stroke-linecap="round"/>
      </g>

    <!-- 翅膀（肩到手把，每帧重算形状） -->
    <path id="wing" fill="#e8e8e4" stroke="#2e2a26" stroke-width="3" stroke-linejoin="round"/>
    <circle id="wingTip" r="7" fill="#e8e8e4" stroke="#2e2a26" stroke-width="3"/>

    <!-- 近侧腿（最前面） -->
    <path id="legNear" fill="none" stroke="#e8912d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse id="footNear" rx="12" ry="5.5" fill="#e8912d"/>

<script>
const $ = id => document.getElementById(id);

// ---- 常量 ----
const CRANK = { x: 445, y: 450, r: 28 };
const WHEEL_R = 55;
const BASE_V = 260;          // 1x 速度下的地面速度 px/s
const L1 = 74, L2 = 74;      // 大腿 / 小腿长度
const GRIP = { x: 562, y: 330 };
const SHOULDER = { x: 452, y: 296 };
const HIP_NEAR = { x: 430, y: 350 };
const HIP_FAR  = { x: 412, y: 344 };

// ---- 状态：所有动画都由这些量推导，调速不失步 ----
let speed = 1, running = true;
let phase = 0.6;             // 曲柄相位（踩踏是整套动画的"心跳"）
let wheelA = 0;              // 车轮转角
let tAnim = 0;               // 动画内时间（暂停时冻结）
let offDash = 0, offTree = 0, offHill = 0, offCloud = 0, offLine = 0;
let nextBlink = 2.2, blinkStart = -1;

// ---- 两腿 IK：髋固定、脚钉在踏板上，解出膝盖 ----
function solveLeg(hip, foot) {
  let dx = foot.x - hip.x, dy = foot.y - hip.y;
  let d = Math.hypot(dx, dy);
  const max = L1 + L2 - 0.5;
  if (d > max) {                       // 够不着时保持腿伸直，脚仍贴着踏板方向
    const s = max / d;
    foot = { x: hip.x + dx * s, y: hip.y + dy * s };
    dx *= s; dy *= s; d = max;
  }
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const ux = dx / d, uy = dy / d;
  return { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux }; // 膝盖朝前
}

function render() {
  const bob = Math.sin(phase * 2) * 3.2;   // 踩踏引起的身体起伏
  const deg = a => a * 180 / Math.PI;

  // 车轮与曲柄
  $('spokesR').setAttribute('transform', `rotate(${deg(wheelA)} 340 460)`);
  $('spokesF').setAttribute('transform', `rotate(${deg(wheelA)} 560 460)`);
  $('crankG').setAttribute('transform', `rotate(${deg(phase)} 445 450)`);

  // 踏板位置（近 / 远相差 180°）
  const pN = { x: CRANK.x + CRANK.r * Math.cos(phase), y: CRANK.y + CRANK.r * Math.sin(phase) };
  const pF = { x: CRANK.x - CRANK.r * Math.cos(phase), y: CRANK.y - CRANK.r * Math.sin(phase) };
  $('pedalNear').setAttribute('x', pN.x - 10); $('pedalNear').setAttribute('y', pN.y - 4);
  $('pedalFar').setAttribute('x', pF.x - 9);   $('pedalFar').setAttribute('y', pF.y - 3.5);

  // 腿：髋随身体起伏，脚钉在踏板上
  const kN = solveLeg({ x: HIP_NEAR.x, y: HIP_NEAR.y + bob }, pN);
  const kF = solveLeg({ x: HIP_FAR.x,  y: HIP_FAR.y + bob },  pF);
  $('legNear').setAttribute('d', `M ${HIP_NEAR.x} ${HIP_NEAR.y + bob} L ${kN.x} ${kN.y} L ${pN.x} ${pN.y - 5}`);
  $('legFar').setAttribute('d',  `M ${HIP_FAR.x} ${HIP_FAR.y + bob} L ${kF.x} ${kF.y} L ${pF.x} ${pF.y - 5}`);

  // 脚（平放在踏板上，随曲柄微微倾斜）
  const footAt = (el, p, ang) => {
    el.setAttribute('cx', p.x); el.setAttribute('cy', p.y - 7);
    el.setAttribute('transform', `rotate(${ang} ${p.x} ${p.y - 7})`);
  };
  footAt($('footNear'), pN, 8 * Math.cos(phase));
  footAt($('footFar'),  pF, -8 * Math.cos(phase));

  // 身体起伏
  $('pelican').setAttribute('transform', `translate(0 ${bob})`);

  // 头轻微点头，喉囊跟着晃
  $('headG').setAttribute('transform', `rotate(${Math.sin(phase * 2 + 1.1) * 3.5} 470 268)`);
  $('pouchG').setAttribute('transform', `rotate(${Math.sin(phase * 2 - 0.6) * 5} 518 240)`);

  // 眨眼
  if (tAnim > nextBlink) { blinkStart = tAnim; nextBlink = tAnim + 2.4 + Math.random() * 3.2; }
  const bt = tAnim - blinkStart;
  const eyeScale = (bt >= 0 && bt < 0.13) ? 0.12 : 1;
  $('eyeG').setAttribute('transform', `translate(500 226) scale(1 ${eyeScale}) translate(-500 -226)`);

  // 翅膀：肩随身体动，翼尖始终搭在车把上
  const S = { x: SHOULDER.x, y: SHOULDER.y + bob };
  const mx = (S.x + GRIP.x) / 2, my = (S.y + GRIP.y) / 2;
  let dx = GRIP.x - S.x, dy = GRIP.y - S.y;
  const len = Math.hypot(dx, dy), px = -dy / len, py = dx / len;
  const flap = Math.sin(phase * 2 + 0.8) * 7;
  const c1 = { x: mx - px * 20, y: my - py * 20 };
  const c2 = { x: mx + px * (34 + flap), y: my + py * (34 + flap) };
  $('wing').setAttribute('d', `M ${S.x} ${S.y} Q ${c1.x} ${c1.y} ${GRIP.x} ${GRIP.y} Q ${c2.x} ${c2.y} ${S.x} ${S.y} Z`);
  $('wingTip').setAttribute('cx', GRIP.x); $('wingTip').setAttribute('cy', GRIP.y);

  // 背景视差
  $('cloudLayer').setAttribute('transform', `translate(${-(offCloud % 800)} 0)`);
  $('hillLayer').setAttribute('transform', `translate(${-(offHill % 800)} 0)`);
  $('treeLayer').setAttribute('transform', `translate(${-(offTree % 800)} 0)`);
  $('dashLayer').setAttribute('transform', `translate(${-(offDash % 800)} 0)`);

  // 速度线：速度快了才出现并向后飞
  const sl = $('speedLines');
  sl.setAttribute('opacity', Math.max(0, Math.min(0.7, (speed - 1) * 0.5)));
  sl.setAttribute('transform', `translate(${-(offLine % 120)} 0)`);
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) {
    tAnim += dt;
    const v = BASE_V * speed;
    wheelA += v / WHEEL_R * dt;        // 车轮：纯滚动
    phase += v * 0.0085 * dt;          // 踩踏节奏与车速成正比
    offDash += v * dt;                 // 地面：与车速一致
    offTree += v * 0.5 * dt;
    offHill += v * 0.22 * dt;
    offCloud += v * 0.06 * dt;
    offLine += v * 1.4 * dt;
    render();
  }
  requestAnimationFrame(tick);
}

// ---- 控件 ----
$('speed').addEventListener('input', e => {
  speed = parseFloat(e.target.value);
  $('speedVal').textContent = speed.toFixed(2).replace(/0$/, '') + '×';
});
$('pauseBtn').addEventListener('click', () => {
  running = !running;
  $('pauseBtn').textContent = running ? '暂停' : '继续';
});

render();
requestAnimationFrame(tick);
</script>
</body>
